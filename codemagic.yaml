workflows:
  expo-android:
    name: Expo Android Build
    instance_type: mac_mini_m2  # Uses your free 500 minutes
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Expo Prebuild
        script: npx expo prebuild
      - name: Build Android
        script: cd android && ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
